<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Max's Auto Dealership</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  </head>
  <body>
    <header id="site-header">
      <h1>Max&#39;s Auto Dealership</h1>
      <p class="tagline">Browse and manage our inventory</p>
    </header>

    <main id="main-content">
      <section id="form-section">
        <h2 id="form-title">Add a Car</h2>
        <form id="car-form">
          <input type="hidden" id="edit-id" value="" />

          <div class="field-group">
            <label for="make">Make</label>
            <input type="text" id="make" name="make" placeholder="e.g. Toyota" required />
          </div>
          <div class="field-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model" placeholder="e.g. Camry" required />
          </div>
          <div class="field-group">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" min="1900" max="2026" placeholder="e.g. 2020" required />
          </div>
          <div class="field-group">
            <label for="price">Price ($)</label>
            <input type="number" id="price" name="price" min="0" placeholder="e.g. 18000" required />
          </div>
          <div class="field-group">
            <label for="mpg">MPG</label>
            <input type="number" id="mpg" name="mpg" min="0" placeholder="e.g. 32" required />
          </div>

          <div class="button-row">
            <button type="submit" id="submit-btn">Add Car</button>
            <button type="button" id="cancel-btn" class="hidden">Cancel</button>
          </div>
        </form>
      </section>

      <section id="inventory-section">
        <h2>Current Inventory</h2>
        <table id="inventory-table">
          <thead>
            <tr>
              <th>Make</th>
              <th>Model</th>
              <th>Year</th>
              <th>Price</th>
              <th>MPG</th>
              <th>Value Rating</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-body">
          </tbody>
        </table>
        <p id="empty-msg" class="hidden">No cars in inventory yet.</p>
      </section>
    </main>

    <footer id="site-footer">
      <p>&#169; 2025 Max&#39;s Auto Dealership</p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
